steps:
  # Pull previous image
  - name: gcr.io/cloud-builders/docker
    id: Pull Cache Image
    args:
      - '-c'
      - 'docker pull $_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE_NAME:latest || exit 0'
    entrypoint: bash

  # Build image
  # Build context is the monorepo root so pnpm-lock.yaml is used as-is.
  # NEXT_PUBLIC_* vars are written to .env.local before docker build.
  - name: gcr.io/cloud-builders/docker
    id: Build Image
    env:
      - 'NEXT_PUBLIC_ENV=${BRANCH_NAME}'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=$_NEXT_PUBLIC_FIREBASE_API_KEY'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=$_NEXT_PUBLIC_FIREBASE_PROJECT_ID'
      - 'NEXT_PUBLIC_IS_PREVIEW_MODE=$_IS_PREVIEW_MODE'
    args:
      - '-c'
      - >
        printenv | tee packages/$_TARGET_PACKAGE/.env.local

        docker build \

        -f packages/$_TARGET_PACKAGE/Dockerfile \

        -t $_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE_NAME:${BRANCH_NAME}_${SHORT_SHA} \

        -t $_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE_NAME:latest \

        --cache-from $_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE_NAME:latest .
    entrypoint: bash

  # Push container image to registry
  - name: gcr.io/cloud-builders/docker
    id: Push Versioned Image
    args:
      - push
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE_NAME:${BRANCH_NAME}_${SHORT_SHA}'

  # Deploy container image to Cloud Runs
  - name: gcr.io/cloud-builders/gcloud
    id: Deploy Image
    entrypoint: 'bash'
    args:
      - '-c'
      - |

        # read cloud run service names from substitution variable
        IFS=',' read -r -a cloud_runs <<< "$_CLOUD_RUN_SERVICE_NAMES"

        for cr in "${cloud_runs[@]}"
        do

        gcloud run deploy "$cr" --image $_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE_NAME:${BRANCH_NAME}_${SHORT_SHA} --region asia-east1

        done

  # Push container image to registry to update the latest one
  - name: gcr.io/cloud-builders/docker
    id: Push Latest Image
    args:
      - push
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE_NAME:latest'

timeout: 1800s

substitutions:
  _TARGET_PACKAGE: ''
  _IMAGE_NAME: ''
  _CLOUD_RUN_SERVICE_NAMES: ''
  _IS_PREVIEW_MODE: 'false'
  _AR_LOCATION: 'us' # Artifact Registry region
  _AR_REPOSITORY: 'gcr.io' # Artifact Registry Docker repository name
  _NEXT_PUBLIC_FIREBASE_API_KEY: ''
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ''
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: ''
